spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${ORDER_DB_USER:orderflow}
    password: ${ORDER_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 3000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  kafka:
    order-created-topic: ${ORDER_CREATED_TOPIC:order.created}
    partitions: ${ORDER_CREATED_PARTITIONS:3}
    replicas: ${ORDER_CREATED_REPLICAS:1}
  cache:
    orders:
      ttl: ${ORDER_CACHE_TTL:PT10M}
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:500ms}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    lock-timeout: ${OUTBOX_LOCK_TIMEOUT:PT30S}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:PT5S}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:PT1S}
    max-backoff: ${OUTBOX_MAX_BACKOFF:PT1M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis,kafka
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
    propagation:
      type: W3C
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: 5s
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}

info:
  app:
    name: ${spring.application.name}
    description: Persists orders and reliably publishes OrderCreated events through a transactional outbox
